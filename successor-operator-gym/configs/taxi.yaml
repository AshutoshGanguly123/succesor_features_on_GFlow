env_name: Taxi-v3

variants:
  - name: default
    env_kwargs: {}
    description: "Default Taxi - richer state graph with 500 states"

# Feature dimension: 4 (dropoff, illegal, pickup, step_count)
# w = [w_dropoff, w_illegal, w_pickup, w_step]
reference_w: [5.0, -3.0, 1.0, -0.05]

task_weights:
  - name: "standard"
    w: [5.0, -3.0, 1.0, -0.05]
  - name: "dropoff_heavy"
    w: [10.0, -2.0, 0.5, -0.05]
  - name: "no_illegal"
    w: [5.0, -8.0, 1.0, -0.05]
  - name: "fast"
    w: [5.0, -3.0, 1.0, -0.2]
  - name: "explore"
    w: [3.0, -1.0, 2.0, -0.01]
  - name: "cautious"
    w: [5.0, -5.0, 1.0, -0.1]

geometry_sweep:
  base_w: [5.0, -3.0, 1.0, -0.05]
  delta_range: [-2.0, 2.0]
  n_deltas: 15
  seed: 42

n_rollout_episodes: 2000
max_episode_steps: 500
n_workers: 6
seed: 42
