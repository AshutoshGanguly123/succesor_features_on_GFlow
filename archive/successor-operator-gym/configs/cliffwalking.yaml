env_name: CliffWalking-v1

variants:
  - name: deterministic
    env_kwargs: {}
    description: "Deterministic cliff walking - path cost and hazard avoidance"

# Feature dimension: 3 (goal, cliff_hit, step_count)
# w = [w_goal, w_cliff, w_step]
reference_w: [10.0, -10.0, -0.1]

task_weights:
  - name: "standard"
    w: [10.0, -10.0, -0.1]
  - name: "goal_heavy"
    w: [15.0, -5.0, -0.1]
  - name: "cliff_fear"
    w: [10.0, -20.0, -0.05]
  - name: "fast_goal"
    w: [12.0, -8.0, -0.5]
  - name: "cautious"
    w: [8.0, -15.0, -0.2]
  - name: "explore"
    w: [5.0, -3.0, -0.01]

geometry_sweep:
  base_w: [10.0, -10.0, -0.1]
  delta_range: [-4.0, 4.0]
  n_deltas: 20
  seed: 42

n_rollout_episodes: 2000
max_episode_steps: 500
n_workers: 6
seed: 42
